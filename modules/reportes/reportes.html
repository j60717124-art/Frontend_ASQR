<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reportes · Sistema de Asistencia QR</title>
  <link rel="stylesheet" href="/shared/css/colors.css">
  <link rel="stylesheet" href="/shared/css/menu.css">
  <link rel="stylesheet" href="reportes.css">
</head>
<body>
  <main class="rep">
    <header class="rep-head">
      <div>
        <h1 class="rep-title">Reportes</h1>
        <p class="rep-sub" id="resumen">Genera reportes de asistencia por estudiante, materia o período.</p>
      </div>
    </header>

    <!-- FILTROS -->
    <section class="panel filters">
      <div class="filter-grid">
        <div class="f">
          <label for="tipoReporte">Tipo de reporte</label>
          <select class="select" id="tipoReporte">
            <option value="estudiantes">Asistencia de Estudiantes</option>
            <option value="docentes">Asistencia de Docentes</option>
          </select>
        </div>
        <div class="f">
          <label for="fechaInicio">Fecha de inicio</label>
          <input class="input" type="date" id="fechaInicio">
        </div>
        <div class="f">
          <label for="fechaFin">Fecha de fin</label>
          <input class="input" type="date" id="fechaFin">
        </div>
        <div class="f" id="filtroMateriaWrap">
          <label for="filtroMateria">Materia (opcional)</label>
          <select class="select" id="filtroMateria">
            <option value="">Todas las materias</option>
          </select>
        </div>
        <div class="f" id="filtroEstudianteWrap">
          <label for="filtroEstudiante">Estudiante (opcional)</label>
          <select class="select" id="filtroEstudiante">
            <option value="">Todos los estudiantes</option>
          </select>
        </div>
        <div class="f" id="filtroDocenteWrap" hidden>
          <label for="filtroDocente">Docente (opcional)</label>
          <select class="select" id="filtroDocente">
            <option value="">Todos los docentes</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn--primary" id="btnGenerar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7"/>
            <path d="M21 4v5h-5"/>
          </svg>
          Generar reporte
        </button>
        <button class="btn btn--ghost" id="btnPDF" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
          </svg>
          Exportar PDF
        </button>
        <button class="btn btn--ghost" id="btnExcel" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
          </svg>
          Exportar Excel
        </button>
      </div>
    </section>

    <!-- RESULTADOS -->
    <section class="panel results" id="resultados" hidden>
      <div class="results-head">
        <h2 id="resultsTitle">Resultados</h2>
        <div class="stats">
          <div class="stat">
            <strong id="statTotal">0</strong>
            <span>Registros</span>
          </div>
          <div class="stat">
            <strong id="statOk">0</strong>
            <span>Aceptados</span>
          </div>
          <div class="stat">
            <strong id="statNo">0</strong>
            <span>Rechazados</span>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table" id="tablaResultados">
          <thead>
            <tr id="tablaHead"></tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="/connection/config.js"></script>
  <script src="/connection/api.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script src="/shared/js/menu.js"></script>
  <script src="reportes.js"></script>
</body>
</html>
