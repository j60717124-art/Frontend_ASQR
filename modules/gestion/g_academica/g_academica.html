<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestión académica · Sistema de Asistencia QR</title>
  <link rel="stylesheet" href="/shared/css/colors.css">
  <link rel="stylesheet" href="/shared/css/menu.css">
  <link rel="stylesheet" href="g_academica.css">
</head>
<body>
  <main class="acc">

    <header class="acc-head">
      <div>
        <h1 class="acc-title">Gestión académica</h1>
        <p class="acc-sub" id="resumen">Cargando gestiones…</p>
      </div>
      <button class="btn btn--primary" type="button" id="btnNueva">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nueva gestión
      </button>
    </header>

    <section class="panel">
      <div class="toolbar">
        <label class="field-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="fBuscar" placeholder="Buscar gestión" autocomplete="off" aria-label="Buscar gestiones">
        </label>
        <select class="select" id="fEstado" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option>En curso</option>
          <option>Próxima</option>
          <option>Finalizada</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Gestión</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Duración</th>
              <th>Estado</th>
              <th class="th-actions"><span class="sr-only">Acciones</span></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="vacio" hidden>
          <strong>No hay gestiones para mostrar</strong>
          <span>Cambia los filtros o crea una gestión nueva.</span>
        </div>
      </div>

      <footer class="pager" id="pager" hidden>
        <span id="pagerInfo"></span>
        <div class="pager__btns">
          <button class="btn btn--ghost btn--sm" type="button" id="btnPrev">Anterior</button>
          <button class="btn btn--ghost btn--sm" type="button" id="btnNext">Siguiente</button>
        </div>
      </footer>
    </section>
  </main>

  <!-- MODAL: CREAR / EDITAR -->
  <dialog class="modal" id="dlgGestion" aria-labelledby="dlgTitulo">
    <form id="formGestion" novalidate>
      <header class="modal__head">
        <h2 id="dlgTitulo">Nueva gestión</h2>
        <button class="icon-btn" type="button" data-cerrar aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="modal__body">
        <input type="hidden" id="idgestion_academica">

        <div class="grid">
          <div class="f f--full">
            <label for="nombre">Nombre de la gestión</label>
            <input class="input" id="nombre" maxlength="60" autocomplete="off" placeholder="Ej.: Gestión 2027" required>
            <small class="err" data-err="nombre"></small>
          </div>

          <div class="f">
            <label for="fecha_inicio">Fecha de inicio</label>
            <input class="input" id="fecha_inicio" type="date" required>
            <small class="err" data-err="fecha_inicio"></small>
          </div>

          <div class="f">
            <label for="fecha_fin">Fecha de fin</label>
            <input class="input" id="fecha_fin" type="date" required>
            <small class="err" data-err="fecha_fin"></small>
          </div>

          <div class="f f--full">
            <small class="hint" id="hintDuracion">Indica las fechas para calcular la duración.</small>
          </div>
        </div>
      </div>

      <footer class="modal__foot">
        <button class="btn btn--ghost" type="button" data-cerrar>Cancelar</button>
        <button class="btn btn--primary" type="submit" id="btnGuardar">Guardar gestión</button>
      </footer>
    </form>
  </dialog>

  <!-- MODAL: CONFIRMAR ELIMINAR -->
  <dialog class="modal modal--sm" id="dlgEliminar" aria-labelledby="delTitulo">
    <div class="modal__body">
      <h2 id="delTitulo">Eliminar gestión</h2>
      <p class="del-text" id="delTexto"></p>
    </div>
    <footer class="modal__foot">
      <button class="btn btn--ghost" type="button" data-cerrar>Cancelar</button>
      <button class="btn btn--danger" type="button" id="btnConfirmarEliminar">Eliminar gestión</button>
    </footer>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/shared/js/menu.js"></script>
  <script src="g_academica.js"></script>
</body>
</html>
