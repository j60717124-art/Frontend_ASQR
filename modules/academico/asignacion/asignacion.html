<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asignaciones · Sistema de Asistencia QR</title>
  <link rel="stylesheet" href="/shared/css/colors.css">
  <link rel="stylesheet" href="/shared/css/menu.css">
  <link rel="stylesheet" href="asignacion.css">
</head>
<body>
  <main class="acc">

    <header class="acc-head">
      <div>
        <h1 class="acc-title">Asignaciones</h1>
        <p class="acc-sub" id="resumen">Cargando asignaciones…</p>
      </div>
      <button class="btn btn--primary" type="button" id="btnNueva">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nueva asignación
      </button>
    </header>

    <section class="panel">
      <div class="toolbar">
        <label class="field-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="fBuscar" placeholder="Buscar estudiante, CI o materia" autocomplete="off" aria-label="Buscar asignaciones">
        </label>
        <select class="select" id="fGestion" aria-label="Filtrar por gestión"><option value="">Todas las gestiones</option></select>
        <select class="select" id="fParalelo" aria-label="Filtrar por paralelo"><option value="">Todos los paralelos</option></select>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Estudiante</th>
              <th>Paralelo</th>
              <th>Gestión</th>
              <th>Horario</th>
              <th>Asignado</th>
              <th class="th-actions"><span class="sr-only">Acciones</span></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="vacio" hidden>
          <strong>No hay asignaciones para mostrar</strong>
          <span>Cambia los filtros o crea una asignación nueva.</span>
        </div>
      </div>

      <footer class="pager" id="pager" hidden>
        <span id="pagerInfo"></span>
        <div class="pager__btns">
          <button class="btn btn--ghost btn--sm" type="button" id="btnPrev">Anterior</button>
          <button class="btn btn--ghost btn--sm" type="button" id="btnNext">Siguiente</button>
        </div>
      </footer>
    </section>
  </main>

  <!-- MODAL: CREAR / EDITAR -->
  <dialog class="modal modal--wide" id="dlgAsig" aria-labelledby="dlgTitulo">
    <form id="formAsig" novalidate>
      <header class="modal__head">
        <h2 id="dlgTitulo">Nueva asignación</h2>
        <button class="icon-btn" type="button" data-cerrar aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="modal__body">
        <input type="hidden" id="idasignacion">

        <div class="grid">
          <div class="f f--full">
            <label for="estudiante_idestudiante">Estudiante</label>
            <select class="select" id="estudiante_idestudiante" required><option value="">Selecciona un estudiante</option></select>
            <div class="meta"><small class="err" data-err="estudiante_idestudiante"></small><small class="hint" id="hintEst"></small></div>
          </div>

          <div class="f">
            <label for="gestion_academica_idgestion_academica">Gestión académica</label>
            <select class="select" id="gestion_academica_idgestion_academica" required><option value="">Selecciona una gestión</option></select>
            <div class="meta"><small class="err" data-err="gestion_academica_idgestion_academica"></small><small class="hint" id="hintGes"></small></div>
          </div>

          <div class="f">
            <label for="fecha_asignacion">Fecha de asignación</label>
            <input class="input" id="fecha_asignacion" type="date" required>
            <div class="meta"><small class="err" data-err="fecha_asignacion"></small></div>
          </div>

          <div class="f f--full">
            <label for="paralelo_idparalelo">Paralelo</label>
            <select class="select" id="paralelo_idparalelo" required><option value="">Selecciona un paralelo</option></select>
            <div class="meta"><small class="err" data-err="paralelo_idparalelo"></small><small class="hint" id="hintPar"></small></div>
          </div>

          <div class="f f--full">
            <label id="lblHorario" for="horario_idhorario">Horarios</label>
            <!-- Al crear se pueden marcar varios horarios; al editar se elige uno -->
            <div class="hbox" id="horarioChecks" role="group" aria-labelledby="lblHorario"></div>
            <select class="select" id="horario_idhorario" hidden><option value="">Selecciona un horario</option></select>
            <div class="meta"><small class="err" data-err="horarios"></small><small class="hint" id="hintHor"></small></div>
          </div>
        </div>
      </div>

      <footer class="modal__foot">
        <button class="btn btn--ghost" type="button" data-cerrar>Cancelar</button>
        <button class="btn btn--primary" type="submit" id="btnGuardar">Guardar asignación</button>
      </footer>
    </form>
  </dialog>

  <!-- MODAL: CONFIRMAR ELIMINAR -->
  <dialog class="modal modal--sm" id="dlgEliminar" aria-labelledby="delTitulo">
    <div class="modal__body">
      <h2 id="delTitulo">Eliminar asignación</h2>
      <p class="del-text" id="delTexto"></p>
    </div>
    <footer class="modal__foot">
      <button class="btn btn--ghost" type="button" data-cerrar>Cancelar</button>
      <button class="btn btn--danger" type="button" id="btnConfirmarEliminar">Eliminar asignación</button>
    </footer>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/shared/js/menu.js"></script>
  <script src="asignacion.js"></script>
</body>
</html>
