<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aulas · Sistema de Asistencia QR</title>
  <link rel="stylesheet" href="/shared/css/colors.css">
  <link rel="stylesheet" href="/shared/css/menu.css">
  <link rel="stylesheet" href="aulas.css">
</head>
<body>
  <main class="acc">

    <header class="acc-head">
      <div>
        <h1 class="acc-title">Aulas</h1>
        <p class="acc-sub" id="resumen">Cargando aulas…</p>
      </div>
      <button class="btn btn--primary" type="button" id="btnNueva">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nueva aula
      </button>
    </header>

    <section class="panel">
      <div class="toolbar">
        <label class="field-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="fBuscar" placeholder="Buscar por aula o ubicación" autocomplete="off" aria-label="Buscar aulas">
        </label>
        <select class="select" id="fColegio" aria-label="Filtrar por colegio" hidden>
          <option value="">Todos los colegios</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Aula</th>
              <th>Ubicación</th>
              <th>Colegio</th>
              <th class="th-actions"><span class="sr-only">Acciones</span></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="vacio" hidden>
          <strong>No hay aulas para mostrar</strong>
          <span>Cambia los filtros o crea un aula nueva.</span>
        </div>
      </div>

      <footer class="pager" id="pager" hidden>
        <span id="pagerInfo"></span>
        <div class="pager__btns">
          <button class="btn btn--ghost btn--sm" type="button" id="btnPrev">Anterior</button>
          <button class="btn btn--ghost btn--sm" type="button" id="btnNext">Siguiente</button>
        </div>
      </footer>
    </section>
  </main>

  <!-- MODAL: CREAR / EDITAR -->
  <dialog class="modal" id="dlgAula" aria-labelledby="dlgTitulo">
    <form id="formAula" novalidate>
      <header class="modal__head">
        <h2 id="dlgTitulo">Nueva aula</h2>
        <button class="icon-btn" type="button" data-cerrar aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="modal__body">
        <input type="hidden" id="idaula">

        <div class="grid">
          <div class="f f--full">
            <label for="nombre">Nombre del aula</label>
            <input class="input" id="nombre" maxlength="100" autocomplete="off" placeholder="Ej.: Aula 101 o Laboratorio de Computación" required>
            <div class="meta">
              <small class="err" data-err="nombre"></small>
              <small class="count" id="cntNombre">0/100</small>
            </div>
          </div>

          <div class="f f--full">
            <label for="colegio_idcolegio">Colegio</label>
            <select class="select" id="colegio_idcolegio" required>
              <option value="">Selecciona un colegio</option>
            </select>
            <div class="meta">
              <small class="err" data-err="colegio_idcolegio"></small>
              <small class="hint" id="hintColegio"></small>
            </div>
          </div>

          <div class="f f--full">
            <label for="ubicacion">Ubicación</label>
            <textarea class="input input--area" id="ubicacion" maxlength="255" rows="3" placeholder="Bloque, piso o referencias. Ej.: Bloque A · 2.º piso"></textarea>
            <div class="meta">
              <small class="err" data-err="ubicacion"></small>
              <small class="count" id="cntUbic">0/255</small>
            </div>
          </div>
        </div>
      </div>

      <footer class="modal__foot">
        <button class="btn btn--ghost" type="button" data-cerrar>Cancelar</button>
        <button class="btn btn--primary" type="submit" id="btnGuardar">Guardar aula</button>
      </footer>
    </form>
  </dialog>

  <!-- MODAL: CONFIRMAR ELIMINAR -->
  <dialog class="modal modal--sm" id="dlgEliminar" aria-labelledby="delTitulo">
    <div class="modal__body">
      <h2 id="delTitulo">Eliminar aula</h2>
      <p class="del-text" id="delTexto"></p>
    </div>
    <footer class="modal__foot">
      <button class="btn btn--ghost" type="button" data-cerrar>Cancelar</button>
      <button class="btn btn--danger" type="button" id="btnConfirmarEliminar">Eliminar aula</button>
    </footer>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/shared/js/menu.js"></script>
  <script src="aulas.js"></script>
</body>
</html>
