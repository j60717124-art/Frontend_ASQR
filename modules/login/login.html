  <script>
    /* Aplica el tema guardado antes de pintar para evitar parpadeos */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

        <svg class="icon-sun" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Formulario de Inicio de Sesión -->
      <div class="login-box" id="loginBox">
        <div class="login-header">
          <span class="welcome-label">BIENVENIDO</span>
          <h1>Sistema de  <span>Asistencia por QR.</span></h1>
          <p>Inicia sesión para registrar asistencia.</p>
        </div>

        <form id="loginForm">
          <div class="input-group">
            <label for="usuario">USUARIO</label>
            <div class="input-box">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/>
                <path d="M4 21C4 16.8 7.3 14 12 14C16.7 14 20 16.8 20 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username" required>
            </div>
          </div>

          <div class="input-group">
            <label for="password">CONTRASEÑA</label>
            <div class="input-box">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7"/>
                <circle cx="12" cy="15" r="1.5" fill="currentColor"/>
              </svg>
              <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
              <button type="button" id="showPassword" class="show-password" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.7"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="login-options">
            <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="login-button" id="loginButton">
            <span>INICIAR </span>
            <span class="arrow"></span>
            <span class="button-shine"></span>
          </button>
          <p id="message" class="message"></p>
        </form>
          <div class="login-footer">
            <span></span>
            <p><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>PLATAFORMA SEGURA</p>
            <span></span>
          </div>
      </div>

      <!-- Formulario de Recuperación de Contraseña (Oculto por defecto) -->
      <div class="login-box hidden-box recover-box" id="recoverBox">
          <div class="login-header">
            <span class="welcome-label">RECUPERACIÓN</span>
            <h1>Recuperar <span>Contraseña</span></h1>
            <p>Ingresa tu correo para enviarte un enlace.</p>
          </div>

          <form id="recoverForm">
            <div class="input-group">
              <label for="recoverEmail">CORREO ELECTRÓNICO</label>
              <div class="input-box">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M3 7L12 13L21 7" stroke="currentColor" stroke-width="1.7"/>
                </svg>
                <input type="email" id="recoverEmail" placeholder="tu@correo.com" required>
              </div>
            </div>

            <button type="submit" class="login-button" id="recoverButton">
              <span>ENVIAR ENLACE</span>
              <span class="arrow"></span>
              <span class="button-shine"></span>
            </button>
            <p id="recoverMessage" class="message"></p>
          </form>

          <div class="login-footer" style="margin-top: 20px;">
            <span></span>
            <a href="#" id="backToLoginLink" class="back-link">VOLVER AL LOGIN</a>
            <span></span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="login.js"></script>
</body>
</html>
